name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build and test
        run: ./build.sh

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: warp-26.3
          path: target/warp-26.3.jar
          if-no-files-found: error
